name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pre-release-quality-gate:
    name: Verify Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          components: rustfmt, clippy

      - name: Code Formatting Check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy Lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Complete Test Suite
        run: cargo test --all-targets --all-features

  build:
    name: Build (${{ matrix.target }})
    needs: pre-release-quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pdown-linux-x64
            legacy_artifact_name: irflutter-linux-x64
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pdown-macos-arm64
            legacy_artifact_name: irflutter-macos-arm64
            use_cross: false

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pdown-macos-x64
            legacy_artifact_name: irflutter-macos-x64
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pdown-windows-x64.exe
            legacy_artifact_name: irflutter-windows-x64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          targets: ${{ matrix.target }}

      - name: Build Binaries
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Stage Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pdown ${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/irflutter ${{ matrix.legacy_artifact_name }}

      - name: Stage Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item target/${{ matrix.target }}/release/pdown.exe -Destination ${{ matrix.artifact_name }}
          Copy-Item target/${{ matrix.target }}/release/irflutter.exe -Destination ${{ matrix.legacy_artifact_name }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.legacy_artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum pdown-* irflutter-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: PackageDownloader ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/*
            registry/mirrors.json
            registry/mirrors.json.sig
          generate_release_notes: true
