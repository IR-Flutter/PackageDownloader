name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pdown-linux-x64
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pdown-macos-arm64
            use_cross: false

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pdown-macos-x64
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pdown-windows-x64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} --bin pdown

      - name: Stage Artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pdown ${{ matrix.artifact_name }}

      - name: Stage Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item target/${{ matrix.target }}/release/pdown.exe -Destination ${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum pdown-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: PackageDownloader ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/*
            registry/mirrors.json
            registry/mirrors.json.sig
          generate_release_notes: true
