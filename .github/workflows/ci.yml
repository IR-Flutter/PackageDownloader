name: CI Quality Gates

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Strict Linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  registry-verification:
    name: Remote Mirror Registry Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Canonical Registry Signature and Schema
        run: cargo test --test registry_test

  cross-platform-test-matrix:
    name: Test Suite (${{ matrix.os }})
    needs: [lint-and-format, registry-verification]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Complete Test Suite
        run: cargo test --all-targets --all-features
