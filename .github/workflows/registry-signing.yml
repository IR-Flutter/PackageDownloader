name: Registry Verification & Automated Signing

on:
  pull_request:
    paths:
      - 'registry/**'
      - '.github/workflows/registry-signing.yml'
  push:
    branches: [main]
    paths:
      - 'registry/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-test:
    name: Validate Registry Integrity & Live Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master

      - name: Validate Registry Schema & Semantics
        run: cargo run --bin sign_registry -- --validate-only

      - name: Run Non-Signature Registry Tests
        run: cargo test --test registry_test -- --skip test_canonical_mirrors_json_signature

      - name: Informational Live Endpoint Probes
        run: |
          echo "Running live endpoint reachability probes..."
          cargo run --bin pdown -- test --timeout 8 || echo "::warning::Some external mirror endpoints failed reachability probes."

  sign-and-publish:
    name: Sign Registry (Maintainer Release / Main Branch)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master

      - name: Verify Signing Secret Presence
        env:
          REGISTRY_SIGNING_PRIVATE_KEY: ${{ secrets.REGISTRY_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${REGISTRY_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::REGISTRY_SIGNING_PRIVATE_KEY secret is not configured in repository secrets."
            exit 1
          fi

      - name: Sign mirrors.json using Protected Secret Key
        env:
          REGISTRY_SIGNING_PRIVATE_KEY: ${{ secrets.REGISTRY_SIGNING_PRIVATE_KEY }}
        run: |
          cargo run --bin sign_registry

      - name: Verify Newly Generated Signature
        run: |
          cargo test --test registry_test test_canonical_mirrors_json_signature

      - name: Run Complete Registry Test Suite
        run: |
          cargo test --test registry_test

      - name: Commit and Publish Canonical Signature
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain registry/mirrors.json.sig) ]]; then
            git add registry/mirrors.json.sig
            git commit -m "chore(registry): update canonical signature for mirrors.json [skip ci]"
            git push
            echo "✅ Successfully published new registry signature."
          else
            echo "Signature is already up to date with mirrors.json."
          fi
